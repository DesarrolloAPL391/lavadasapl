<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>Ingresar · Lavadero</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="brand">
      <img src="icons/icon-192.png" alt="" class="brand-icon" />
      <h1>Lavadero</h1>
      <p class="brand-sub">Programación de lavadas</p>
    </div>

    <form id="login-form" class="auth-form" novalidate>
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="admin@lavadero.com" required />

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />

      <p id="login-error" class="error-box" role="alert" hidden></p>

      <button id="login-submit" type="submit" class="btn-primary">Ingresar</button>
    </form>
  </main>

  <p class="auth-version">Lavadero <span data-app-version>v…</span></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pwaUpdate.js"></script>
</body>
</html>
